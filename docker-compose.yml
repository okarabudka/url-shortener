services:
  app:
    build: .
    image: url-shortener:local
    env_file:
      # Optional so that `docker compose down` works without it; the app refuses to start without credentials.
      - path: .env
        required: false
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
